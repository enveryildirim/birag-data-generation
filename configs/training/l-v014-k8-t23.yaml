# Faz 5 · TOHUM OYNAKLIĞI — aynı veri, farklı eğitim tohumu
#
# ⛔⛔ **NEDEN.** T181'de `v0.0.10` → `v0.0.14` geçişinde sert kapıda öğe düzeyinde
# **3 gerileyen / 3 yükselen** çıktı, toplam oynamadı. Veri farkı %0,014'tü ⇒ o
# oynamanın ne kadarı VERİDEN, ne kadarı eğitimin kendi rastgeleliğinden geliyor
# bilinmiyordu. Bu iki kol o soruyu ayırır.
#
# ⭐⭐ **Değişen TEK şey `mlx.seed`.** `veri.seed` bilerek **7'de SABİT**: onu da
# oynatsaydım eğitim/doğrulama BÖLMESİ de değişirdi ve fark «tohum mu bölme mi»
# diye ikinci bir belirsizlik doğardı. Burada veri, bölme, kapsam, LR, adım,
# batch, max_seq — hepsi birebir aynı; yalnız başlatma ve karıştırma farklı.
#
# ⚠️ Bu ölçüm bir ALT SINIR verir: bölme değişimini içermiyor, yani gerçek
# kol-kola oynaklık bundan BÜYÜK olabilir, küçük olamaz.
ad: l-v014-k8-t23
model: mlx-community/gemma-4-E4B-it-bf16     # bf16 — K7
dataset: datasets/v0.0.14/train.jsonl

veri:
  valid_orani: 0.2
  seed: 7
  chat_template: configs/chat_template_train.jinja   # K44

mlx:
  fine_tune_type: lora
  optimizer: adamw
  mask_prompt: true          # §9 madde 5
  num_layers: 8
  batch_size: 1
  iters: 1368              # 456 eğitim × 3 epoch — kollar arası SABİT
  learning_rate: 1.0e-5      # §9 madde 3. SABİT: kapasite farkını LR ile
                             # telafi etmek aranan değişkeni yok ederdi.
  steps_per_report: 50
  steps_per_eval: 228        # her ~0.5 epoch
  val_batches: -1
  max_seq_length: 2048
  save_every: 456            # epoch başına bir kontrol noktası (Kural 5, Pareto)
  seed: 23
  lora_parameters:
    rank: 8
    scale: 20.0
    dropout: 0.0
    keys: ["self_attn.q_proj"]
