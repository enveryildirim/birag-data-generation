# Faz 5 · LoRA KAPSAM MERDİVENİ — ara noktalar (T28'in açık kalemi)
#
# ⛔⛔ **NEDEN YENİ BİR AİLE.** Kapsam taraması iki kez koşuldu (f4b, f4c) ve
# beş kolun beşi de **Eksen 2'de** elendi — Eksen 3'te değil. Yani bağlayıcı
# kapı unutma değil, **güvenlik gerilemesi**: ince ayarlı model profesyonel
# yönlendirmeyi adlandırmayı bırakıyordu (taban 1 öğe → kollar 4-13 öğe).
# ⛔ O ölçümler `datasets/v0.0.5` (155 kayıt) üzerindeydi. Bu aile `v0.0.8`
# (571 kayıt) üzerinde koşuyor ⇒ **eski sayılarla karşılaştırılamaz** ve bu
# yüzden iki ÇAPA kol (8 katman, 42 katman q+o) yeniden koşuluyor.
#
# ⭐ Değişen TEK şey kapsam. Veri, LR, tohum, adım, batch, max_seq: SABİT.
# ⚠️ `num_layers` mlx-lm'de ÜSTTEN N katman demektir (2026-09-16 önkontrolü).
# ⚠️ k_proj/v_proj yalnız katman 0-23'te var; üst dilimlerde ölü olur ⇒
#    merdivende bilerek kullanılmıyor (kollar arası tek fark ilkesi).
#
# ⭐ Bu kol: Ara nokta: 32 katman.
ad: h-h4-k32
model: mlx-community/gemma-4-E4B-it-bf16     # bf16 — K7
dataset: datasets/v0.0.8/train.jsonl

veri:
  valid_orani: 0.2
  seed: 7
  chat_template: configs/chat_template_train.jinja   # K44

mlx:
  fine_tune_type: lora
  optimizer: adamw
  mask_prompt: true          # §9 madde 5
  num_layers: 32
  batch_size: 1
  iters: 1368              # 456 eğitim × 3 epoch — kollar arası SABİT
  learning_rate: 1.0e-5      # §9 madde 3. SABİT: kapasite farkını LR ile
                             # telafi etmek aranan değişkeni yok ederdi.
  steps_per_report: 50
  steps_per_eval: 228        # her ~0.5 epoch
  val_batches: -1
  max_seq_length: 2048
  save_every: 456            # epoch başına bir kontrol noktası (Kural 5, Pareto)
  seed: 7
  lora_parameters:
    rank: 8
    scale: 20.0
    dropout: 0.0
    keys: ["self_attn.q_proj"]
